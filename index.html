<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>Puglia, May 2026</title>
    <style>
      #map {
        height: 100vh;
        width:  100%;
      }
      #layers {
        position:      absolute;
        bottom:        6px;
        left:          6px;
        background:    white;
        padding:       6px;
        border-radius: 3px;
        box-shadow:    0 2px 6px rgba(0,0,0,0.3);
        font-family:   sans-serif;
        font-size:     14px;
        z-index:       9999;
        max-width:     200px;         /* Or whatever limit fits your map */
        overflow-x:    auto;          /* Shows scrollbar only when needed */
        white-space:   nowrap;        /* Prevents text from wrapping to a new line */
      }
    </style>
  </head>

  <body>
    <div id='layers'></div>
    <div id='map'></div>
  </body>
  <script src='layers/list.js'></script>
  <script src='js/map.js'></script>
  <script
    src='https://maps.googleapis.com/maps/api/js?key=AIzaSyB3sfpp0u9UForUSTcrZhhPLF1iWxKkXKU&callback=initMap'
    async
    defer
  ></script>
</html>
