<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Puglia, May 2026</title>
  <link rel='stylesheet' href='style.css'>
  <link rel='icon' type='image/x-icon' href='favicon.ico'>
</head>
<body>
  <div id='sidebar-wrapper'>
    <div id='sidebar'>
      <div class='layer-controls'>
        <button onclick='toggleAllLayers(true)'>All On</button>
        <button onclick='toggleAllLayers(false)'>All Off</button>
        <button onclick='recenterMap()'>Re-center</button>
      </div>
      <div id='layers'></div>
    </div>
    <button id='sidebar-toggle' onclick='toggleSidebar()'>
      <span class='icon'>❮</span>
    </button>
  </div>
  <button id='sidebar-toggle' onclick='toggleSidebar()'>
    <span class='icon'>❮</span>
  </button>

  <div id='map'></div>
  <script
    src='https://maps.googleapis.com/maps/api/js?key=AIzaSyB3sfpp0u9UForUSTcrZhhPLF1iWxKkXKU&callback=initMap'
    async
    defer
  ></script>
  <script src='layers/layerData.js'></script>
  <script src='map.js'></script>
</body>
</html>
